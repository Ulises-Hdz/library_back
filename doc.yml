openapi: 3.0.3
info:
  title: Library API
  version: 1.0.0
  description: |
    Library API (books, digital resources and physical inventory).
    All routes use the global `/api` prefix.
    Authentication and roles are implemented with JWT Bearer tokens.
    Public registration always creates `STUDENT` users; `ADMIN` users can
    only be created by another authenticated admin.

    **Security & rate limiting**: responses include `helmet` security headers
    and CORS is restricted to the origins listed in `CORS_ORIGIN`. All routes
    are rate-limited to 300 requests/minute per client; `POST /auth/register`
    and `POST /auth/login` are further limited to 10 requests/minute. Exceeding
    a limit returns `429 Too Many Requests`.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Users / Auth
  - name: Books
  - name: Digital resources
  - name: Physical items
  - name: Loans

paths:
  /auth/register:
    post:
      tags: [Users / Auth]
      summary: Register a student account
      description: Public endpoint. Always creates a `STUDENT` user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
            example:
              full_name: Juan Perez
              email: juan.perez@library.dev
              password: Password123
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  _id: 67052b3773fa6065cc7f1e10
                  full_name: Juan Perez
                  email: juan.perez@library.dev
                  role: STUDENT
                  status: ACTIVE
                  createdAt: '2026-10-08T14:26:02.295Z'
                  updatedAt: '2026-10-08T14:26:02.295Z'
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.student
        '400':
          description: Invalid payload or duplicated email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                statusCode: 400
                message: User already exists with that email
                error: Bad Request
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Users / Auth]
      summary: Authenticate a user
      description: |
        Returns the authenticated user and a JWT Bearer token.
        Fails with 403 if the account is `BLOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginUser' }
            example:
              email: juan.perez@library.dev
              password: Password123
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  _id: 67052b3773fa6065cc7f1e10
                  full_name: Juan Perez
                  email: juan.perez@library.dev
                  role: STUDENT
                  status: ACTIVE
                  createdAt: '2026-10-08T14:26:02.295Z'
                  updatedAt: '2026-10-08T14:26:02.295Z'
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.student
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                statusCode: 401
                message: Invalid credentials
                error: Unauthorized
        '403':
          description: The account is blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                statusCode: 403
                message: Your account is blocked. Contact the library staff.
                error: Forbidden
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/profile:
    get:
      tags: [Users / Auth]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
              example:
                id: 67052b3773fa6065cc7f1e10
                email: juan.perez@library.dev
                role: STUDENT
                full_name: Juan Perez
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/admin:
    post:
      tags: [Users / Auth]
      summary: Create an admin user
      description: Protected endpoint. Only an authenticated `ADMIN` can create another admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
            example:
              full_name: Maria Admin
              email: maria.admin@library.dev
              password: AdminPass123
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
              example:
                user:
                  _id: 67052b6573fa6065cc7f1e11
                  full_name: Maria Admin
                  email: maria.admin@library.dev
                  role: ADMIN
                  status: ACTIVE
                  createdAt: '2026-10-08T14:26:49.657Z'
                  updatedAt: '2026-10-08T14:26:49.657Z'
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.admin
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth:
    get:
      tags: [Users / Auth]
      summary: List all users
      description: Protected endpoint. Only an authenticated `ADMIN` can access it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
              example:
                - _id: 67052b3773fa6065cc7f1e10
                  full_name: Juan Perez
                  email: juan.perez@library.dev
                  role: STUDENT
                  status: ACTIVE
                  createdAt: '2026-10-08T14:26:02.295Z'
                  updatedAt: '2026-10-08T14:26:02.295Z'
                - _id: 67052b6573fa6065cc7f1e11
                  full_name: Maria Admin
                  email: maria.admin@library.dev
                  role: ADMIN
                  status: ACTIVE
                  createdAt: '2026-10-08T14:26:49.657Z'
                  updatedAt: '2026-10-08T14:26:49.657Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/{id}:
    parameters:
      - { $ref: '#/components/parameters/MongoId' }
    get:
      tags: [Users / Auth]
      summary: Get a user by id
      description: Protected endpoint. Only an authenticated `ADMIN` can access it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                _id: 67052b3773fa6065cc7f1e10
                full_name: Juan Perez
                email: juan.perez@library.dev
                role: STUDENT
                status: ACTIVE
                createdAt: '2026-10-08T14:26:02.295Z'
                updatedAt: '2026-10-08T14:26:02.295Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users / Auth]
      summary: Update a user
      description: |
        Protected endpoint. Only an authenticated `ADMIN` can update users.
        Responds 403 if an admin tries to block their own account or to
        block another `ADMIN` account (`status=BLOCKED`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
            example:
              full_name: Juan Perez Gomez
              password: NewPassword123
              status: ACTIVE
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                _id: 67052b3773fa6065cc7f1e10
                full_name: Juan Perez Gomez
                email: juan.perez@library.dev
                role: STUDENT
                status: ACTIVE
                createdAt: '2026-10-08T14:26:02.295Z'
                updatedAt: '2026-10-08T14:30:10.112Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users / Auth]
      summary: Delete a user
      description: |
        Protected endpoint. Only an authenticated `ADMIN` can delete users.
        Responds 403 if an admin tries to delete their own account, and 409
        if the user still has unreturned loans.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example:
                _id: 67052b3773fa6065cc7f1e10
                full_name: Juan Perez
                email: juan.perez@library.dev
                role: STUDENT
                status: ACTIVE
                createdAt: '2026-10-08T14:26:02.295Z'
                updatedAt: '2026-10-08T14:26:02.295Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /books:
    post:
      tags: [Books]
      summary: Register a book (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBook' }
      responses:
        '201':
          description: Book creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Books]
      summary: Book search engine (Authenticated)
      description: Filters use partial, case-insensitive matching.
      parameters:
        - { name: title, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }
  /books/inventory:
    get:
      tags: [Books]
      summary: Full inventory with stock and digital availability (Admin)
      description: |
        Returns every book along with its physical stock (`total`/`available`
        copies) and whether it has a linked digital resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookInventoryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /books/{id}:
    parameters:
      - { $ref: '#/components/parameters/MongoId' }
    get:
      tags: [Books]
      summary: Book details (Authenticated)
      responses:
        '200':
          description: Book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Books]
      summary: Update a book (Admin)
      description: All fields are optional. Returns the updated book.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBook' }
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Books]
      summary: Delete a book (Admin)
      description: Responds 409 if any physical item of the book is on loan.
      responses:
        '200':
          description: Book eliminado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /digital-resources:
    post:
      tags: [Digital resources]
      summary: Upload a PDF/EPUB and link it to a book (Admin)
      description: |
        Maximum 100 MB. Only `.pdf` and `.epub`; the content is also validated.
        A book can only have one digital resource.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, book_id]
              properties:
                file: { type: string, format: binary }
                book_id: { type: string, example: 665f1c2e8a1b2c3d4e5f6a7b }
                onlineReadOnly:
                  type: boolean
                  default: true
                  description: If true the file is shown inline; if false it is downloaded.
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DigitalResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /digital-resources/book/{bookId}:
    get:
      tags: [Digital resources]
      summary: Get the digital file of a book (Authenticated)
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File (inline or attachment depending on `onlineReadOnly`)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /digital-resources/{id}:
    delete:
      tags: [Digital resources]
      summary: Delete a digital resource and its file (Admin)
      parameters:
        - { $ref: '#/components/parameters/MongoId' }
      responses:
        '200':
          description: Resource deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /physical-items:
    post:
      tags: [Physical items]
      summary: Register a physical copy (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id, barcode]
              properties:
                book_id: { type: string, example: 665f1c2e8a1b2c3d4e5f6a7b }
                barcode: { type: string, example: LIB-000123 }
                shelfLocation: { type: string, example: A-3 }
      responses:
        '201':
          description: Physical item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhysicalItem' }
        '400':
          description: Invalid data or duplicated barcode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
  /physical-items/book/{bookId}:
    get:
      tags: [Physical items]
      summary: Copy availability of a book (Authenticated)
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Physical item count
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: { type: string }
                  total: { type: integer, example: 5 }
                  available: { type: integer, example: 3 }
                  byStatus:
                    type: object
                    example:
                      AVAILABLE: 3
                      LOANED: 1
                      LOST: 0
                      IN_REPAIR: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /physical-items/book/{bookId}/available:
    get:
      tags: [Physical items]
      summary: List available physical copies of a book (Authenticated)
      security:
        - bearerAuth: []
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Available physical items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PhysicalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /physical-items/{id}/status:
    patch:
      tags: [Physical items]
      summary: Change the status of a physical item (Admin)
      description: |
        `LOANED` cannot be assigned manually (it is managed by loans).
        Responds 409 if the item is on loan.
      parameters:
        - { $ref: '#/components/parameters/MongoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [AVAILABLE, LOST, IN_REPAIR]
      responses:
        '200':
          description: Physical item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhysicalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /loans:
    post:
      tags: [Loans]
      summary: Register a loan (Admin)
      description: Fails with 409 if the physical item is not AVAILABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLoan' }
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Loans]
      summary: List all loans (Admin)
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Loan' }
  /loans/me:
    get:
      tags: [Loans]
      summary: Loans of the authenticated user (Authenticated)
      description: |
        Accessible to `STUDENT` and `ADMIN`. Returns the caller's own loans,
        most recent first, with the physical item and its book populated.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanWithDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /loans/{id}:
    parameters:
      - { $ref: '#/components/parameters/MongoId' }
    get:
      tags: [Loans]
      summary: Loan details (Admin)
      responses:
        '200':
          description: Loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Loans]
      summary: Reassign the user or physical item of an active loan (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLoan' }
      responses:
        '200':
          description: Loan updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Loans]
      summary: Register the return of the book (Admin)
      description: Closes the loan (`status=RETURNED`) and frees the physical item.
      responses:
        '200':
          description: Loan returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    MongoId:
      name: id
      in: path
      required: true
      schema: { type: string, example: 665f1c2e8a1b2c3d4e5f6a7b }
  responses:
    BadRequest:
      description: Invalid data or id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 400
            message: Validation failed
            error: Bad Request
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 401
            message: Unauthorized
            error: Unauthorized
    Forbidden:
      description: Authenticated but without sufficient role permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 403
            message: 'This action requires one of the following roles: ADMIN'
            error: Forbidden
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 404
            message: User with id 665f1c2e8a1b2c3d4e5f6a7b not found
            error: Not Found
    Conflict:
      description: Conflict with the current state of the resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 409
            message: Conflict with the current state of the resource
            error: Conflict
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 429
            message: ThrottlerException Too Many Requests
            error: Too Many Requests
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        message: {}
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    CreateUser:
      type: object
      required: [full_name, email, password]
      properties:
        full_name: { type: string, example: Juan Perez }
        email: { type: string, format: email, example: juan.perez@library.dev }
        password: { type: string, minLength: 8, maxLength: 32, example: Password123 }
    UpdateUser:
      type: object
      description: Same as CreateUser, but all fields are optional.
      properties:
        full_name: { type: string, example: Juan Perez Gomez }
        email: { type: string, format: email, example: juan.perez@library.dev }
        password: { type: string, minLength: 8, maxLength: 32, example: NewPassword123 }
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
          example: ACTIVE
    LoginUser:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: juan.perez@library.dev }
        password: { type: string, example: Password123 }
    User:
      type: object
      properties:
        _id: { type: string, example: 67052b3773fa6065cc7f1e10 }
        full_name: { type: string, example: Juan Perez }
        email: { type: string, format: email, example: juan.perez@library.dev }
        role:
          type: string
          enum: [STUDENT, ADMIN]
          example: STUDENT
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
          example: ACTIVE
        createdAt: { type: string, format: date-time, example: '2026-10-08T14:26:02.295Z' }
        updatedAt: { type: string, format: date-time, example: '2026-10-08T14:26:02.295Z' }
    Profile:
      type: object
      properties:
        id: { type: string, example: 67052b3773fa6065cc7f1e10 }
        email: { type: string, format: email, example: juan.perez@library.dev }
        role:
          type: string
          enum: [STUDENT, ADMIN]
          example: STUDENT
        full_name: { type: string, example: Juan Perez }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.token
    CreateBook:
      type: object
      required: [isbn, title, author, publisher, categories]
      properties:
        isbn: { type: string, example: '9780132350884' }
        title: { type: string, example: Clean Code }
        author: { type: string, example: Robert C. Martin }
        publisher: { type: string, example: Prentice Hall }
        publicationYear: { type: integer, example: 2008 }
        categories:
          type: array
          items: { type: string }
          example: [Programming]
        coverUrl: { type: string, format: uri }
        description: { type: string }
    UpdateBook:
      type: object
      description: Same as CreateBook, but all fields are optional.
      properties:
        isbn: { type: string }
        title: { type: string }
        author: { type: string }
        publisher: { type: string }
        publicationYear: { type: integer }
        categories:
          type: array
          items: { type: string }
        coverUrl: { type: string, format: uri }
        description: { type: string }
    Book:
      allOf:
        - $ref: '#/components/schemas/CreateBook'
        - type: object
          properties:
            _id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    BookInventoryItem:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            stock:
              type: object
              properties:
                total: { type: integer, example: 5 }
                available: { type: integer, example: 3 }
            digital:
              type: boolean
              description: Whether the book has a linked digital resource.
              example: true
    DigitalResource:
      type: object
      properties:
        _id: { type: string }
        book_id: { type: string }
        fileUrl: { type: string, description: Internal name of the stored file }
        format: { type: string, enum: [PDF, EPUB] }
        sizeMegabytes: { type: number }
        onlineReadOnly: { type: boolean }
    PhysicalItem:
      type: object
      properties:
        _id: { type: string }
        book_id: { type: string }
        barcode: { type: string }
        shelfLocation: { type: string }
        status:
          type: string
          enum: [AVAILABLE, LOANED, LOST, IN_REPAIR]
    CreateLoan:
      type: object
      required: [user_id, physical_item_id]
      properties:
        user_id: { type: string, example: 665f1c2e8a1b2c3d4e5f6a7b }
        physical_item_id: { type: string, example: 665f1c2e8a1b2c3d4e5f6a7c }
    UpdateLoan:
      type: object
      description: Same as CreateLoan, but all fields are optional.
      properties:
        user_id: { type: string }
        physical_item_id: { type: string }
    Loan:
      type: object
      properties:
        _id: { type: string }
        user_id: { type: string }
        physical_item_id: { type: string }
        loanDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        returnDate: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [ACTIVE, RETURNED, OVERDUE]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoanWithDetails:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - type: object
          description: Same as Loan, but `physical_item_id` is populated.
          properties:
            physical_item_id:
              type: object
              properties:
                _id: { type: string }
                barcode: { type: string }
                book_id:
                  type: object
                  properties:
                    _id: { type: string }
                    title: { type: string }
                    author: { type: string }
                    isbn: { type: string }
